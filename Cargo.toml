[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/planteman/vsedit"

[workspace.dependencies]
# Shared dependency versions managed at workspace level
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
bytes = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
sha2 = "0.10"
regex = "1"
ropey = "1"
similar = "2"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
walkdir = "2"
globset = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1"
keyring = "3"
dirs = "5"
syntect = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
