[package]
name = "vsedit-configuration"
description = "Settings registry and overrides"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vsedit-di = { path = "../vsedit-di" }
vsedit-events = { path = "../vsedit-events" }
vsedit-json = { path = "../vsedit-json" }
vsedit-registry = { path = "../vsedit-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"

