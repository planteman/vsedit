[package]
name = "vsedit-tui"
description = "Terminal UI framework core (Ratatui + Crossterm)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vsedit-events = { path = "../vsedit-events" }
vsedit-lifecycle = { path = "../vsedit-lifecycle" }
vsedit-platform = { path = "../vsedit-platform" }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", features = ["crossterm"] }
tokio = { version = "1", features = ["full"] }

